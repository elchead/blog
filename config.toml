# The URL the site will be built for
base_url = "https://adrianstobbe.com/"
title = "Adrian Stobbe"
description = "Rapid prototyping to bring ideas and automations to life."
generate_feeds = false

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false
minify_html = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true
taxonomies = [
  {name = "tags", feed = true},
]

[markdown]
render_emoji = true
smart_punctuation = true

# Syntax highlighting (zola 0.22+: moved under [markdown.highlighting], enabled by setting a theme)
[markdown.highlighting]
theme = "one-dark-pro"

[extra]
date_format="%d %b, %Y"

[[extra.main_menu]]
name = "Projects"
url = "/projects"

[[extra.main_menu]]
name = "Posts"
url = "@/posts/_index.md"

# Personal content - accessible via direct URL and footer links
[[extra.main_menu]]
name = "TIL"
url = "@/tils/_index.md"

[[extra.main_menu]]
name = "Books"
url = "@/books/_index.md"

